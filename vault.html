<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffre Hebdo — Les Sages de Pandarie</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <meta name="description" content="Suivi du coffre hebdomadaire (Great Vault) des membres des Sages de Pandarie — Hyjal EU.">
    <meta property="og:title" content="Coffre Hebdo — Les Sages de Pandarie">
    <meta property="og:description" content="Suivi du coffre hebdomadaire (Great Vault) des membres des Sages de Pandarie — Hyjal EU.">
    <meta property="og:image" content="https://www.sagesdepandarie.ovh/img/logo.png">
    <meta property="og:url" content="https://www.sagesdepandarie.ovh/vault.html">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles/common.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="scripts/firebase-init.js"></script>
    <script src="scripts/class-icons.js"></script>

    <style>
        body { padding-top: 80px; background: var(--bg-deep); }

        .content-section { padding: 2.5rem 0 4rem; }

        .page-header {
            position: relative;
            background:
                linear-gradient(180deg, rgba(13,17,23,0.55) 0%, var(--bg-deep) 100%),
                url('img/vault-hero.jpg') center 35%/cover no-repeat;
            padding: 5.5rem 0 3rem;
            border-bottom: none;
        }

        .reset-info { font-size: 0.85rem; color: var(--text-muted); }
        .reset-info strong { color: var(--text-main); }

        .progress-summary {
            display: flex; align-items: center; gap: 1rem;
            background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.08), var(--bg-card) 65%);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 1.1rem 1.4rem; margin-bottom: 1.5rem; flex-wrap: wrap;
        }
        .progress-summary .icon { font-size: 1.6rem; flex-shrink: 0; }
        .progress-summary .big { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--primary); }
        .progress-summary .track { flex: 1; min-width: 120px; height: 8px; background: var(--bg-elevated, #2a2f38); border-radius: 4px; overflow: hidden; }
        .progress-summary .fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 4px; transition: width 0.5s ease; }
        .progress-summary .txt { font-size: 0.82rem; color: var(--text-muted); }

        .table-toolbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .search-input {
            flex: 1; min-width: 220px; max-width: 320px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-main); padding: 0.6rem 1rem; font-size: 0.9rem; font-family: inherit; transition: border-color 0.2s;
        }
        .search-input:focus { outline: none; border-color: var(--primary); }
        .toolbar-count { font-size: 0.8rem; color: var(--text-muted); }
        .vault-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); }
        .vault-table { width: 100%; border-collapse: collapse; background: var(--bg-card); min-width: 680px; }
        .vault-table thead th {
            text-align: left; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--text-muted); padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); background: var(--bg-surface);
        }
        .vault-table thead th.center { text-align: center; }
        .vault-table tbody td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; }
        .vault-table tbody tr:last-child td { border-bottom: none; }
        .vault-table tbody tr:hover td { background: rgba(255,255,255,0.025); }

        .player-cell { display: flex; align-items: center; gap: 0.65rem; border-left: 3px solid var(--row-color, transparent); }
        .class-icon { width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; }
        .player-name { font-weight: 600; }
        .player-role { font-size: 0.72rem; color: var(--text-muted); }

        /* Bloc pips + légende : hauteur fixe pour que les pips restent à la même
           position verticale sur toutes les colonnes, qu'il y ait une légende ou non */
        .vault-cell-content { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; min-height: 2.4em; justify-content: center; }
        .pip-group { display: flex; gap: 3px; }
        .pip { width: 15px; height: 15px; border-radius: 3px; background: var(--bg-elevated, #2a2f38); border: 1px solid var(--border); }
        .pip.filled { background: var(--primary); border-color: var(--primary); }

        .status-pill {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.3rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
        }
        .status-pill.done    { background: rgba(34, 197, 94, 0.12); color: #22c55e; }
        .status-pill.partial { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }
        .status-pill.none    { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .vault-detail { font-size: 0.72rem; color: var(--text-muted); line-height: 1; }
    </style>
</head>
<body>

    <nav class="navbar"></nav>
    <script src="scripts/navbar.js"></script>

    <div class="page-header">
        <div class="container">
            <div class="page-header-row">
                <div>
                    <div class="page-label">Coffre Hebdo</div>
                    <h1>Grand Coffre</h1>
                    <p class="reset-info" id="resetInfo">Chargement…</p>
                </div>
            </div>
        </div>
    </div>

    <section class="content-section">
        <div class="container">
            <div id="loading" class="loader"></div>

            <div id="content" class="hidden">
                <div class="progress-summary">
                    <span class="icon">🗝️</span>
                    <span class="big" id="summaryCount">0/0</span>
                    <div class="track"><div class="fill" id="summaryFill" style="width:0%"></div></div>
                    <span class="txt" id="summaryText"></span>
                </div>

                <div class="table-toolbar">
                    <input type="text" id="searchInput" class="search-input" placeholder="Rechercher un membre…">
                    <span class="toolbar-count" id="toolbarCount"></span>
                </div>

                <div class="vault-table-wrap">
                    <table class="vault-table">
                        <thead>
                            <tr>
                                <th>Membre</th>
                                <th class="center">Mythique+</th>
                                <th class="center">Raid</th>
                                <th class="center" title="Failles uniquement — Traques et Sites rituels non trackables via l'API Blizzard">Monde</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody id="vaultBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="emptyState" class="empty-state hidden">
                <p>🔒</p>
                <p>Aucune donnée de coffre disponible pour le moment.</p>
                <p style="font-size:0.85rem;margin-top:0.5rem">La synchronisation se fait chaque nuit.</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 Les Sages de Pandarie • Hyjal EU</p>
        </div>
    </footer>

    <script>
        const db = firebase.firestore();

        const CLASS_COLORS = {
            'Death Knight': '#C41E3A', 'Demon Hunter': '#A330C9', 'Druid': '#FF7C0A',
            'Evoker': '#33937F', 'Hunter': '#AAD372', 'Mage': '#3FC7EB',
            'Monk': '#00FF98', 'Paladin': '#F48CBA', 'Priest': '#FFFFFF',
            'Rogue': '#FFF468', 'Shaman': '#0070DD', 'Warlock': '#8788EE',
            'Warrior': '#C69B3A'
        };

        function escHtml(s) {
            return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function pipGroup(slots) {
            let html = '<div class="pip-group">';
            for (let i = 0; i < 3; i++) {
                html += `<div class="pip${i < slots ? ' filled' : ''}"></div>`;
            }
            return html + '</div>';
        }

        function statusBadge(v) {
            const total = v.mythicPlusSlots + v.raidSlots + v.worldSlots;
            if (total === 0) return '<span class="status-pill none">Rien cette semaine</span>';
            if (v.mythicPlusSlots === 3 || v.raidSlots === 3 || v.worldSlots === 3) {
                return '<span class="status-pill done">✓ Volet complet</span>';
            }
            return `<span class="status-pill partial">${total}/9 slots</span>`;
        }

        function getNextResetLabel() {
            const now = new Date();
            const next = new Date(now);
            next.setUTCHours(5, 0, 0, 0);
            const day = next.getUTCDay();
            let daysUntil = (2 - day + 7) % 7;
            if (daysUntil === 0 && now >= next) daysUntil = 7;
            next.setUTCDate(next.getUTCDate() + daysUntil);
            return next.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) +
                   ' à ' + next.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' });
        }

        let allMembers = [];
        let vaultById = new Map();

        function renderRow(m) {
            const v = vaultById.get(m.id);
            const color = CLASS_COLORS[m.class] || '#888';
            const iconUrl = classIcons[m.class];
            const mplusDetail = v.mythicPlusDungeons?.length ? `${v.mythicPlusDungeons.length} donjon(s)` : '';
            const raidDetail = v.raidBossesKilled ? `${v.raidBossesKilled} boss` : '';
            const worldDetail = v.worldActivities ? `${v.worldActivities} faille(s)` : '';

            const cell = (slots, detail) => `
                <div class="vault-cell-content">
                    ${pipGroup(slots)}
                    <div class="vault-detail">${detail || '&nbsp;'}</div>
                </div>`;

            return `<tr>
                <td class="player-cell" style="--row-color:${color}">
                    ${iconUrl ? `<img class="class-icon" src="${iconUrl}" alt="${escHtml(m.class)}">` : '<div class="class-icon"></div>'}
                    <div><div class="player-name">${escHtml(m.name)}</div><div class="player-role">${escHtml(m.class || '')}</div></div>
                </td>
                <td class="center">${cell(v.mythicPlusSlots, mplusDetail)}</td>
                <td class="center">${cell(v.raidSlots, raidDetail)}</td>
                <td class="center">${cell(v.worldSlots, worldDetail)}</td>
                <td>${statusBadge(v)}</td>
            </tr>`;
        }

        function renderTable(filterText) {
            const q = (filterText || '').trim().toLowerCase();
            const visible = q ? allMembers.filter(m => m.name.toLowerCase().includes(q)) : allMembers;

            document.getElementById('vaultBody').innerHTML = visible.length
                ? visible.map(renderRow).join('')
                : `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:2rem;">Aucun membre ne correspond à « ${escHtml(filterText)} ».</td></tr>`;

            document.getElementById('toolbarCount').textContent =
                q ? `${visible.length}/${allMembers.length} membres` : `${allMembers.length} membres`;
        }

        async function init() {
            document.getElementById('resetInfo').innerHTML =
                `Prochain reset : <strong>${getNextResetLabel()}</strong>`;

            try {
                const [membersSnap, vaultSnap] = await Promise.all([
                    db.collection('guild-members').where('active', '==', true).get(),
                    db.collection('vault-progress').get()
                ]);

                vaultById = new Map(vaultSnap.docs.map(d => [d.id, d.data()]));
                const totalSlots = m => {
                    const v = vaultById.get(m.id);
                    return v.mythicPlusSlots + v.raidSlots + v.worldSlots;
                };
                allMembers = membersSnap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(m => vaultById.has(m.id))
                    .sort((a, b) => totalSlots(b) - totalSlots(a) || a.name.localeCompare(b.name));

                document.getElementById('loading').classList.add('hidden');

                if (allMembers.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }

                const atLeastOne = allMembers.filter(m => totalSlots(m) > 0).length;
                renderTable('');
                document.getElementById('summaryCount').textContent = `${atLeastOne}/${allMembers.length}`;
                document.getElementById('summaryFill').style.width = `${Math.round(atLeastOne / allMembers.length * 100)}%`;
                document.getElementById('summaryText').textContent =
                    `${Math.round(atLeastOne / allMembers.length * 100)}% des membres ont débloqué au moins un slot cette semaine`;
                document.getElementById('content').classList.remove('hidden');

                document.getElementById('searchInput').addEventListener('input', e => renderTable(e.target.value));

            } catch (err) {
                console.error('Erreur chargement vault:', err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        init();
    </script>
</body>
</html>
