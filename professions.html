<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métiers — Les Sages de Pandarie</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <meta name="description" content="Métiers disponibles au sein de la guilde Les Sages de Pandarie — Hyjal EU.">
    <meta property="og:title" content="Métiers de la Guilde — Les Sages de Pandarie">
    <meta property="og:description" content="Métiers disponibles au sein de la guilde Les Sages de Pandarie — Hyjal EU.">
    <meta property="og:image" content="https://www.sagesdepandarie.ovh/img/logo.png">
    <meta property="og:url" content="https://www.sagesdepandarie.ovh/professions.html">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles/common.css">

    <!-- Wowhead tooltips -->
    <script>const wowhead_tooltips = { "colorLinks": true, "iconizeLinks": true, "renameLinks": false };</script>
    <script src="https://wow.zamimg.com/widgets/power.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="scripts/firebase-init.js"></script>
    <script src="scripts/class-icons.js"></script>

<style>
        body { padding-top: 80px; }


        /* Search & Filters */
        .search-bar-section {
            padding: 2rem 0 1.5rem;
            background: var(--bg-surface);
            position: sticky;
            top: 70px;
            z-index: 50;
            border-bottom: 1px solid var(--border);
        }

        .search-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filter-pills {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-pill {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .filter-pill:hover { border-color: var(--primary); color: var(--primary); }
        .filter-pill.active { background: var(--primary); color: var(--bg-deep); border-color: var(--primary); font-weight: 600; }

        /* Choix de vue (par joueur / par recette) — distinct des filtres : ça ne
           change pas QUOI on regarde, mais COMMENT on l'affiche. */
        .view-mode-row {
            display: flex; align-items: center; gap: 0.65rem;
            margin-top: 0.85rem;
        }
        .view-mode-label { font-size: 0.78rem; color: var(--text-muted); }
        .control-group {
            display: inline-flex; gap: 0.2rem; padding: 0.2rem;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
        }
        .control-btn {
            border: none; background: none; color: var(--text-muted);
            font-size: 0.78rem; font-weight: 600; padding: 0.4rem 0.85rem;
            border-radius: 6px; cursor: pointer; transition: background 0.15s, color 0.15s;
            font-family: inherit; white-space: nowrap;
        }
        .control-btn:hover { color: var(--text-main); }
        .control-btn.active { background: var(--primary); color: var(--bg-deep); }

        /* Content */
        .professions-section { padding: 3rem 0; min-height: 60vh; }

        /* Search results (recipe-centric) */
        .recipe-results { display: flex; flex-direction: column; gap: 1rem; }

        .recipe-result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .recipe-name {
            font-size: 1.1rem;
            font-weight: 700;
            flex: 1;
            min-width: 200px;
        }
        .recipe-name a, .recipe-item a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }
        .recipe-name a:hover, .recipe-item a:hover { text-decoration: underline; }
        .recipe-icon {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        .recipe-crafters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .crafter-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
        }

        .crafter-name { color: #fff; font-weight: 600; }
        .crafter-skill { color: var(--text-muted); font-size: 0.78rem; }

        /* Member list (default view) — une ligne par joueur, métiers en badges compacts */
        .member-list { display: flex; flex-direction: column; gap: 0.5rem; }

        .member-row {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.85rem 1.25rem;
            flex-wrap: wrap;
        }

        .member-row-id {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            width: 210px;
            flex-shrink: 0;
        }

        .member-prof-name { font-size: 0.95rem; font-weight: 700; color: #fff; }
        .member-prof-realm { font-size: 0.75rem; color: var(--text-muted); }

        .class-icon-small {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .member-badges {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            min-width: 0;
        }

        .prof-badge {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            min-width: 128px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.65rem;
            cursor: pointer;
            font-family: inherit;
            text-align: left;
            transition: border-color 0.15s, transform 0.15s;
        }
        .prof-badge:hover { border-color: var(--primary); transform: translateY(-1px); }

        .prof-badge-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .prof-badge-name { color: var(--text-main); }
        .prof-badge-pct { color: var(--text-muted); font-variant-numeric: tabular-nums; font-weight: 600; }

        .skill-bar, .prof-badge-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .skill-bar-fill, .prof-badge-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
            background: #f87171;
        }
        .skill-bar-fill.mid,  .prof-badge-bar-fill.mid  { background: #facc15; }
        .skill-bar-fill.high, .prof-badge-bar-fill.high { background: var(--accent); }

        .tier-legend {
            display: flex; gap: 1.1rem; flex-wrap: wrap;
            font-size: 0.75rem; color: var(--text-muted);
            margin-bottom: 1.25rem;
        }
        .tier-legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
        .tier-dot { width: 8px; height: 8px; border-radius: 50%; }

        .recipe-item {
            font-size: 0.82rem;
            color: var(--text-muted);
            padding: 0.2rem 0;
        }

        /* ── Modale recettes ── */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center; justify-content: center;
            padding: 1.5rem;
            z-index: 1000;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%; max-width: 520px; max-height: 80vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            display: flex; align-items: flex-start; justify-content: space-between;
            gap: 1rem; padding: 1.1rem 1.4rem;
            border-bottom: 1px solid var(--border);
        }
        .modal-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
        .modal-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }
        .modal-close {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0.2rem;
            flex-shrink: 0;
        }
        .modal-close:hover { color: #fff; }
        .modal-body {
            padding: 1rem 1.4rem 1.4rem;
            overflow-y: auto;
        }

        @media (max-width: 640px) {
            .member-row { flex-direction: column; align-items: stretch; }
            .member-row-id { width: 100%; }
        }

        /* Empty / Loading states */
        .state-message {
            text-align: center;
            padding: 4rem 0;
            color: var(--text-muted);
        }

        .state-message .loader { margin: 0 auto 1rem; }

        /* ── Stat tiles (vue d'ensemble, indépendante du filtre/recherche) ── */
        .stat-tiles {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.9rem; margin-bottom: 1.25rem;
        }
        .stat-tile {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
            padding: 1rem 1.1rem;
        }
        .stat-value {
            font-size: 1.6rem; font-weight: 800; color: var(--text-main);
            font-variant-numeric: tabular-nums; line-height: 1.1;
        }
        .stat-value .stat-sub { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }
        .stat-label {
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-muted); margin-top: 0.35rem;
        }

        .result-note {
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .result-note strong { color: var(--primary); }

        @media (max-width: 600px) {
            .page-header h1 { font-size: 2rem; }
            .search-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <nav class="navbar"></nav>
    <script src="scripts/navbar.js"></script>

    <div class="page-header">
        <div class="container">
            <h1>Métiers de la Guilde</h1>
            <p>Recettes Midnight — qui craft quoi</p>
        </div>
    </div>

    <div class="search-bar-section">
        <div class="container">
            <div class="search-row">
                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Rechercher une recette... (ex: Scout's Scaled Vest)"
                    autocomplete="off"
                >
                <div class="filter-pills" id="filterPills">
                    <button class="filter-pill active" data-filter="all" onclick="setFilter('all')">Tous</button>
                </div>
                <button id="housingToggle" class="filter-pill" onclick="toggleHousing()" title="Recettes de décoration Housing, tous métiers confondus">🏠 Housing</button>
                <button id="langToggle" class="filter-pill" onclick="toggleLang()" title="Basculer la langue des recettes">🇫🇷 FR</button>
            </div>
            <div class="view-mode-row">
                <span class="view-mode-label">Affichage :</span>
                <div class="control-group" id="viewModeGroup">
                    <button class="control-btn active" data-view="member" onclick="setViewMode('member')">Vue par joueur</button>
                    <button class="control-btn" data-view="recipe" onclick="setViewMode('recipe')">Vue par recette</button>
                </div>
            </div>
        </div>
    </div>

    <section class="professions-section">
        <div class="container">
            <div id="statTiles" class="stat-tiles" style="display:none"></div>
            <div id="resultNote" class="result-note" style="display:none"></div>
            <div class="tier-legend" id="tierLegend" style="display:none">
                <span><span class="tier-dot" style="background:#f87171"></span> &lt;40% de maîtrise</span>
                <span><span class="tier-dot" style="background:#facc15"></span> 40-74%</span>
                <span><span class="tier-dot" style="background:var(--accent)"></span> ≥75% — clique un métier pour voir ses recettes</span>
            </div>
            <div id="content">
                <div class="state-message">
                    <div class="loader"></div>
                    <p>Chargement des métiers...</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 Les Sages de Pandarie • Hyjal EU</p>
        </div>
    </footer>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modalTitle"></div>
                    <div class="modal-sub" id="modalSub"></div>
                </div>
                <button type="button" class="modal-close" onclick="closeProfModal()" aria-label="Fermer">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        const db = firebase.firestore();

        const PROF_FR = {
            'Alchemy': 'Alchimie', 'Blacksmithing': 'Forge', 'Cooking': 'Cuisine',
            'Enchanting': 'Enchantement', 'Engineering': 'Ingénierie', 'Fishing': 'Pêche',
            'Herbalism': 'Herboristerie', 'Inscription': 'Calligraphie', 'Jewelcrafting': 'Joaillerie',
            'Leatherworking': 'Travail du cuir', 'Mining': 'Minage', 'Skinning': 'Dépeçage',
            'Tailoring': 'Couture'
        };
        function profName(name) { return PROF_FR[name] || name; }

        let allMembers = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let currentLang = 'fr';

        function escHtml(s) {
            return String(s)
                .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                .replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function recipeName(r) {
            return currentLang === 'fr' ? (r.nameFr || r.name) : r.name;
        }

        function wowheadLink(r) {
            if (r.spellId) return `https://www.wowhead.com/spell=${r.spellId}`;
            return `https://www.wowhead.com/search?q=${encodeURIComponent(r.name)}`;
        }

        function wowheadDomain() {
            return currentLang === 'fr' ? 'domain=fr&' : '';
        }

        // Couleurs de rareté WoW standard — bien plus lisible que le bleu de lien par défaut
        const QUALITY_COLORS = { 0: '#9d9d9d', 1: '#ffffff', 2: '#1eff00', 3: '#0070dd', 4: '#a335ee', 5: '#ff8000' };
        function qualityColor(r) {
            return QUALITY_COLORS[r.quality] || 'var(--primary)';
        }

        function recipeIconHtml(r) {
            if (!r.icon) return '';
            return `<img class="recipe-icon" src="https://wow.zamimg.com/images/wow/icons/small/${r.icon}.jpg" alt="" loading="lazy">`;
        }

        async function loadProfessions() {
            try {
                const snapshot = await db.collection('guild-members')
                    .where('active', '==', true)
                    .get();

                allMembers = [];
                snapshot.forEach(doc => {
                    const m = doc.data();
                    if (m.midnightProfessions && m.midnightProfessions.length > 0) {
                        allMembers.push(m);
                    }
                });

                allMembers.sort((a, b) => a.name.localeCompare(b.name));
                membersByKey = new Map(allMembers.map(m => [memberKey(m), m]));
                buildFilters();
                renderStatTiles();
                render();
            } catch (e) {
                document.getElementById('content').innerHTML = `
                    <div class="state-message">
                        <p>Erreur lors du chargement des données.</p>
                    </div>`;
            }
        }

        function buildFilters() {
            const profSet = new Set();
            allMembers.forEach(m => m.midnightProfessions.forEach(p => profSet.add(p.name)));

            const pills = document.getElementById('filterPills');
            pills.innerHTML = `<button class="filter-pill active" data-filter="all" onclick="setFilter('all')">Tous</button>`;
            [...profSet].sort().forEach(prof => {
                pills.innerHTML += `<button class="filter-pill" data-filter="${prof}" onclick="setFilter('${prof}')">${profName(prof)}</button>`;
            });
        }

        function renderStatTiles() {
            const el = document.getElementById('statTiles');
            if (!allMembers.length) { el.style.display = 'none'; return; }

            const uniqueRecipes = new Set();
            const housingRecipes = new Set();
            const profCounts = new Map(); // profession name -> nb membres qui la connaissent
            let bestCrafter = null;
            let bestCrafterCount = -1;

            allMembers.forEach(member => {
                let memberRecipeCount = 0;
                member.midnightProfessions.forEach(prof => {
                    profCounts.set(prof.name, (profCounts.get(prof.name) || 0) + 1);
                    prof.recipes.forEach(r => {
                        uniqueRecipes.add(r.id);
                        if (r.isHousingDecor) housingRecipes.add(r.id);
                        memberRecipeCount++;
                    });
                });
                if (memberRecipeCount > bestCrafterCount) {
                    bestCrafterCount = memberRecipeCount;
                    bestCrafter = member;
                }
            });

            const topProf = [...profCounts.entries()].sort((a, b) => b[1] - a[1])[0] || null;

            el.style.display = 'grid';
            el.innerHTML = `
                <div class="stat-tile">
                    <div class="stat-value">${uniqueRecipes.size}</div>
                    <div class="stat-label">Recettes uniques couvertes</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-value">${topProf ? escHtml(profName(topProf[0])) : '—'}${topProf ? ` <span class="stat-sub">${topProf[1]} membres</span>` : ''}</div>
                    <div class="stat-label">Métier le plus représenté</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-value">${bestCrafter ? escHtml(bestCrafter.name) : '—'}${bestCrafter ? ` <span class="stat-sub">${bestCrafterCount} recettes</span>` : ''}</div>
                    <div class="stat-label">Meilleur artisan</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-value">🏠 ${housingRecipes.size}</div>
                    <div class="stat-label">Recettes décoration maison</div>
                </div>
            `;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('#filterPills .filter-pill').forEach(p => {
                p.classList.toggle('active', p.dataset.filter === filter);
            });
            render();
        }

        let housingOnly = false;

        function toggleHousing() {
            housingOnly = !housingOnly;
            document.getElementById('housingToggle').classList.toggle('active', housingOnly);
            render();
        }

        // Housing/métier sont de purs filtres (quoi montrer) ; la vue (comment le
        // montrer) est un choix explicite de l'utilisateur, sauf pour la recherche
        // texte qui force la vue par recette — chercher un objet précis, c'est
        // intrinsèquement "qui sait le faire", pas "qui est doué en quoi".
        let viewMode = 'member'; // 'member' | 'recipe'

        function setViewMode(mode) {
            viewMode = mode;
            render();
        }

        function effectiveViewMode(query) {
            return query.length >= 2 ? 'recipe' : viewMode;
        }

        function recipeMatchesQuery(r, query) {
            if (!query) return true;
            return r.name.toLowerCase().includes(query) || (r.nameFr || '').toLowerCase().includes(query);
        }

        function render() {
            const query = searchQuery.trim().toLowerCase();
            const mode = effectiveViewMode(query);

            document.querySelectorAll('#viewModeGroup .control-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.view === mode);
            });
            document.getElementById('tierLegend').style.display = mode === 'member' ? 'flex' : 'none';

            if (mode === 'recipe') {
                renderRecipeIndex(query);
            } else {
                renderByMember(query);
            }

            // Re-init Wowhead tooltips
            if (typeof WH !== 'undefined' && WH.GameTooltip) {
                setTimeout(() => WH.GameTooltip.initializeProxies(), 200);
            }
        }

        function skillTierClass(pct) {
            return pct >= 75 ? 'high' : pct >= 40 ? 'mid' : '';
        }

        // Vue "par recette" : utilisée pour la recherche texte ET pour le filtre
        // Housing (transversal aux métiers, donc incompatible avec la vue par
        // joueur qui présuppose une seule liste de recettes par badge métier).
        function renderRecipeIndex(query) {
            const recipeMap = new Map();

            allMembers.forEach(member => {
                const profs = filterProfs(member.midnightProfessions);
                profs.forEach(prof => {
                    prof.recipes.forEach(recipe => {
                        if (housingOnly && !recipe.isHousingDecor) return;
                        if (query && !(recipe.name.toLowerCase().includes(query) || (recipe.nameFr || '').toLowerCase().includes(query))) return;
                        if (!recipeMap.has(recipe.id)) {
                            recipeMap.set(recipe.id, { recipe, crafters: [] });
                        }
                        recipeMap.get(recipe.id).crafters.push({ member, prof });
                    });
                });
            });

            const label = housingOnly
                ? `${recipeMap.size} recette${recipeMap.size > 1 ? 's' : ''} de décoration maison${query ? ' correspondant à la recherche' : ''}`
                : `${recipeMap.size} recette${recipeMap.size > 1 ? 's' : ''} trouvée${recipeMap.size > 1 ? 's' : ''}`;
            updateResultNote(label);

            if (recipeMap.size === 0) {
                const emptyMsg = housingOnly
                    ? `Aucune recette de décoration maison${query ? ` pour "<strong>${escHtml(searchQuery)}</strong>"` : ''} chez les membres actifs.`
                    : `Aucune recette trouvée pour "<strong>${escHtml(searchQuery)}</strong>".`;
                document.getElementById('content').innerHTML = `<div class="state-message"><p>${emptyMsg}</p></div>`;
                return;
            }

            let html = '<div class="recipe-results">';
            recipeMap.forEach(({ recipe, crafters }) => {
                const crafterBadges = crafters.map(({ member, prof }) => `
                    <div class="crafter-badge">
                        <img src="${classIcons[member.class] || ''}" style="width:20px;height:20px;border-radius:4px;" alt="" loading="lazy">
                        <span class="crafter-name">${escHtml(member.name)}</span>
                        <span class="crafter-skill">${prof.skillPoints}/${prof.maxSkillPoints}</span>
                    </div>
                `).join('');

                html += `
                    <div class="recipe-result-card">
                        <div class="recipe-name">
                            <a href="${wowheadLink(recipe)}" data-wowhead="${wowheadDomain()}recipe=${recipe.id}" target="_blank" rel="noopener" style="color:${qualityColor(recipe)}">${recipeIconHtml(recipe)}${escHtml(recipeName(recipe))}</a>
                        </div>
                        <div class="recipe-crafters">${crafterBadges}</div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderByMember(query) {
            const filtersActive = housingOnly || !!query;

            const rows = [];
            allMembers.forEach(member => {
                if (currentFilter !== 'all' && !member.midnightProfessions.some(p => p.name === currentFilter)) return;

                const profs = filterProfs(member.midnightProfessions).map(prof => {
                    const recipes = prof.recipes.filter(r => (!housingOnly || r.isHousingDecor) && recipeMatchesQuery(r, query));
                    return { prof, recipes };
                }).filter(({ recipes }) => !filtersActive || recipes.length > 0);

                if (profs.length === 0) return;
                rows.push({ member, profs });
            });

            updateResultNote(`${rows.length} membre${rows.length > 1 ? 's' : ''} avec des recettes Midnight${filtersActive ? ' correspondant aux filtres' : ''}`);

            if (rows.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="state-message">
                        <p>Aucune donnée disponible pour ces filtres.<br>
                        La sync quotidienne (2h du matin) n'a peut-être pas encore tourné avec cette mise à jour.</p>
                    </div>`;
                return;
            }

            let html = '<div class="member-list">';
            rows.forEach(({ member, profs }) => {
                const icon = classIcons[member.class] || '';
                const realm = member.realm !== 'hyjal' ? ` <span style="color:var(--text-muted);font-size:0.72rem;">(${escHtml(member.realm)})</span>` : '';
                const key = escHtml(memberKey(member));

                const badgesHtml = profs.map(({ prof }) => {
                    const pct = Math.round(prof.skillPoints / prof.maxSkillPoints * 100);
                    const tier = skillTierClass(pct);
                    return `
                        <button type="button" class="prof-badge" data-member-key="${key}" data-prof="${escHtml(prof.name)}">
                            <div class="prof-badge-head">
                                <span class="prof-badge-name">${escHtml(profName(prof.name))}</span>
                                <span class="prof-badge-pct">${prof.skillPoints}/${prof.maxSkillPoints}</span>
                            </div>
                            <div class="prof-badge-bar"><div class="prof-badge-bar-fill ${tier}" style="width:${pct}%"></div></div>
                        </button>
                    `;
                }).join('');

                html += `
                    <div class="member-row">
                        <div class="member-row-id">
                            <img src="${icon}" class="class-icon-small" alt="${escHtml(member.class)}" loading="lazy">
                            <div>
                                <div class="member-prof-name">${escHtml(member.name)}${realm}</div>
                                <div class="member-prof-realm">${escHtml(member.class)}${member.activeSpec ? ' — ' + escHtml(member.activeSpec) : ''}</div>
                            </div>
                        </div>
                        <div class="member-badges">${badgesHtml}</div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function filterProfs(profs) {
            if (currentFilter === 'all') return profs;
            return profs.filter(p => p.name === currentFilter);
        }

        function updateResultNote(text) {
            const note = document.getElementById('resultNote');
            note.style.display = 'block';
            note.innerHTML = `<strong>${text}</strong> — données mises à jour chaque nuit à 2h`;
        }

        // ── Modale recettes (clic sur un badge métier) ──────────────────────────
        function memberKey(m) { return `${m.name}|${m.realm}`; }

        let membersByKey = new Map();

        function openProfModal(member, prof, recipes) {
            const pct = Math.round(prof.skillPoints / prof.maxSkillPoints * 100);
            const filtered = recipes.length !== prof.recipes.length;
            document.getElementById('modalTitle').textContent = `${member.name} — ${profName(prof.name)}`;
            document.getElementById('modalSub').textContent =
                `${prof.skillPoints} / ${prof.maxSkillPoints} (${pct}%) · ${recipes.length} recette${recipes.length > 1 ? 's' : ''}` +
                (filtered ? ` sur ${prof.recipes.length} (filtres actifs)` : '');
            document.getElementById('modalBody').innerHTML = recipes.map(r => `
                <div class="recipe-item">
                    <a href="${wowheadLink(r)}" data-wowhead="${wowheadDomain()}recipe=${r.id}" target="_blank" rel="noopener" style="color:${qualityColor(r)}">${recipeIconHtml(r)}${escHtml(recipeName(r))}</a>
                </div>
            `).join('');
            document.getElementById('modalOverlay').classList.add('open');
            if (typeof WH !== 'undefined' && WH.GameTooltip) {
                setTimeout(() => WH.GameTooltip.initializeProxies(), 200);
            }
        }

        function closeProfModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        document.getElementById('content').addEventListener('click', e => {
            const badge = e.target.closest('.prof-badge');
            if (!badge) return;
            const member = membersByKey.get(badge.dataset.memberKey);
            const prof = member?.midnightProfessions.find(p => p.name === badge.dataset.prof);
            if (!member || !prof) return;
            const query = searchQuery.trim().toLowerCase();
            const recipes = prof.recipes.filter(r => (!housingOnly || r.isHousingDecor) && recipeMatchesQuery(r, query));
            openProfModal(member, prof, recipes);
        });

        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target.id === 'modalOverlay') closeProfModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeProfModal();
        });

        function toggleLang() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            document.getElementById('langToggle').textContent = currentLang === 'fr' ? '🇫🇷 FR' : '🇬🇧 EN';
            render();
        }

        // Search with debounce
        document.getElementById('searchInput').addEventListener('input', e => {
            searchQuery = e.target.value;
            clearTimeout(window._searchTimeout);
            window._searchTimeout = setTimeout(render, 200);
        });

        loadProfessions();
    </script>

</body>
</html>
