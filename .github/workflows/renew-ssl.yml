name: Renew GitHub Pages SSL Certificate

on:
  schedule:
    - cron: '0 3 1 * *'  # 1er de chaque mois
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Check cert expiry
        id: check
        run: |
          EXPIRY=$(echo | openssl s_client -connect www.sagesdepandarie.ovh:443 \
            -servername www.sagesdepandarie.ovh 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2)
          echo "Expiry: $EXPIRY"
          DAYS=$(( ( $(date -d "$EXPIRY" +%s) - $(date +%s) ) / 86400 ))
          echo "Days remaining: $DAYS"
          if [ "$DAYS" -gt 35 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Cert valid for $DAYS days — nothing to do."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Cert expires in $DAYS days — renewing."
          fi

      - name: Disable Cloudflare proxy
        if: steps.check.outputs.skip == 'false'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RECORDS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?proxied=true&per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read id; do
            echo "Disabling proxy: $id"
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":false}'
          done

      - name: Wait for cert approval (max 20 min)
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 20); do
            STATE=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/shani-gaming/shani-gaming.github.io/pages" \
              | jq -r '.https_certificate.state // "unknown"')
            echo "Tentative $i/20 — état cert : $STATE"
            [ "$STATE" = "approved" ] && { echo "Cert renouvelé !"; break; }
            sleep 60
          done

      - name: Re-enable Cloudflare proxy
        if: steps.check.outputs.skip == 'false'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RECORDS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read id; do
            echo "Re-enabling proxy: $id"
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":true}'
          done
