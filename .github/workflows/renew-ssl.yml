name: Renew GitHub Pages SSL Certificate

on:
  schedule:
    - cron: '0 3 * * 1'  # tous les lundis 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer le renouvellement même si le cert est valide'
        type: boolean
        default: false
      test_notify:
        description: 'Envoyer seulement un message de test Discord (aucun renouvellement)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REPO: shani-gaming/shani-gaming.github.io
  DOMAIN: www.sagesdepandarie.ovh
  APEX: sagesdepandarie.ovh
  ORIGIN_IP: 185.199.108.153

jobs:
  renew-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Test Discord notification
        if: inputs.test_notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "${WEBHOOK:-}" ] || { echo "::error::secret DISCORD_WEBHOOK_URL vide"; exit 1; }
          curl -sf -X POST "$WEBHOOK" -H "Content-Type: application/json" \
            -d '{"content":"✅ Test : les alertes du renouvellement SSL du site arrivent bien ici."}'
          echo "Message de test envoyé."

      # Le cert qui compte est celui de l'ORIGINE (GitHub Pages), pas celui que
      # sert Cloudflare. Derrière le proxy, un openssl s_client sur le nom public
      # renvoie le cert edge de Cloudflare — c'est ce qui avait masqué la panne
      # de septembre 2026. L'API Pages est la seule source d'autorité.
      - name: Check certificate state (GitHub Pages API)
        id: check
        if: ${{ !inputs.test_notify }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          PAGES=$(curl -sf \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages")

          STATE=$(echo "$PAGES" | jq -r '.https_certificate.state // "none"')
          EXPIRES=$(echo "$PAGES" | jq -r '.https_certificate.expires_at // empty')
          DESC=$(echo "$PAGES" | jq -r '.https_certificate.description // ""')
          echo "State       : $STATE"
          echo "Description : $DESC"
          echo "Expires at  : ${EXPIRES:-inconnu}"

          if [ -n "$EXPIRES" ]; then
            DAYS=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
          else
            DAYS=-1
          fi
          echo "Days remaining: $DAYS"

          if [ "${{ inputs.force }}" = "true" ]; then
            REASON="force demandé"
          elif [ "$STATE" != "approved" ]; then
            REASON="état du cert = $STATE ($DESC)"
          elif [ "$DAYS" -lt 30 ]; then
            REASON="expire dans $DAYS jours"
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Cert approuvé et valide $DAYS jours — rien à faire."
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "Renouvellement : $REASON"

      # HTTP-01 exige que Let's Encrypt joigne directement GitHub. Tant que le
      # proxy Cloudflare est actif, la validation échoue et l'autorisation ACME
      # finit en bad_authz.
      - name: Disable Cloudflare proxy
        id: proxy_off
        if: steps.check.outputs.skip == 'false'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          echo "touched=true" >> $GITHUB_OUTPUT
          RECORDS=$(curl -sf \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?proxied=true&per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read -r id; do
            echo "Disabling proxy: $id"
            curl -sf -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":false}' | jq -r '.result.name + " -> proxied=" + (.result.proxied|tostring)'
          done

      # 1.1.1.1 est le résolveur de Cloudflare : il voit le changement en
      # quelques secondes, alors que les résolveurs de Let's Encrypt (validation
      # multi-points) gardent la réponse proxifiée en cache jusqu'à 5 min.
      # Relancer ACME trop tôt donne bad_authz en une minute : c'est la cause
      # des échecs du 02/11 au 23/11/2026, prouvée par le test manuel du 25/11
      # (relance 12 min après la coupure du proxy = certificat émis aussitôt).
      # On attend donc les DEUX noms sur plusieurs résolveurs, puis 5 min de marge.
      - name: Wait for DNS to point at GitHub
        if: steps.check.outputs.skip == 'false'
        run: |
          check() {  # $1 nom, $2 résolveur : toutes les IPv4 doivent être GitHub
            IPS=$(dig +short A "$1" @"$2" | grep -E '^[0-9.]+$' | tr '\n' ' ')
            echo "  $1 @$2 -> ${IPS:-vide}"
            [ -n "$IPS" ] && ! echo "$IPS" | tr ' ' '\n' | grep -E '^[0-9]' | grep -vq '^185\.199\.'
          }
          for i in $(seq 1 30); do
            echo "[$i/30]"
            OK=1
            for name in "$DOMAIN" "$APEX"; do
              for r in 1.1.1.1 8.8.8.8 9.9.9.9; do
                check "$name" "$r" || OK=0
              done
            done
            if [ "$OK" = 1 ]; then
              echo "DNS pointe sur GitHub partout. Marge de 5 min pour les caches de Let's Encrypt..."
              sleep 300
              exit 0
            fi
            sleep 30
          done
          echo "DNS toujours pas propagé après 15 min."
          exit 1

      # Le GH_PAT n'a pas la permission "Pages: write" (PUT /pages = 403) : on
      # relance ACME en supprimant puis recréant le fichier CNAME, ce qui fait
      # réellement retirer puis remettre le domaine custom. Un PUT du CNAME avec
      # un contenu identique ne relance rien (bug du 1er août 2026).
      # GitHub ne réessaie pas tout seul après un bad_authz (observé le 25/11) :
      # jusqu'à 3 tentatives, espacées de 5 min.
      - name: Restart ACME and wait for certificate
        if: steps.check.outputs.skip == 'false'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          gh_api() {
            curl -sf -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          restart_acme() {
            echo "Retrait du domaine custom (suppression du fichier CNAME)..."
            SHA=$(gh_api "https://api.github.com/repos/$REPO/contents/CNAME" | jq -r '.sha')
            gh_api -X DELETE "https://api.github.com/repos/$REPO/contents/CNAME" \
              -d "{\"message\":\"chore: remove CNAME to restart ACME\",\"sha\":\"$SHA\"}" >/dev/null
            sleep 60
            echo "Remise du domaine custom..."
            gh_api -X PUT "https://api.github.com/repos/$REPO/contents/CNAME" \
              -d "{\"message\":\"chore: restore CNAME (trigger cert issuance)\",\"content\":\"$(printf '%s' "$DOMAIN" | base64 -w0)\"}" >/dev/null
          }

          for attempt in 1 2 3; do
            echo "=== Tentative $attempt/3 ==="
            restart_acme
            # Un "approved" lu avant tout autre état est celui de l'ANCIEN cert
            # (faux succès du 02/11) : on ne l'accepte qu'après avoir vu la
            # relance démarrer.
            STARTED=0; BAD=0
            for i in $(seq 1 15); do
              sleep 60
              PAGES=$(gh_api "https://api.github.com/repos/$REPO/pages" || echo '{}')
              STATE=$(echo "$PAGES" | jq -r '.https_certificate.state // "none"')
              EXPIRES=$(echo "$PAGES" | jq -r '.https_certificate.expires_at // ""')
              echo "[$i/15] state=$STATE expires=$EXPIRES"
              case "$STATE" in
                approved)
                  if [ "$STARTED" = 1 ]; then echo "Certificat émis."; exit 0; fi ;;
                bad_authz)
                  STARTED=1; BAD=$((BAD+1))
                  [ "$BAD" -ge 3 ] && break ;;
                *)
                  STARTED=1; BAD=0 ;;
              esac
            done
            [ "$attempt" -lt 3 ] && { echo "Échec de la tentative $attempt, nouvel essai dans 5 min."; sleep 300; }
          done
          echo "ERREUR : pas de certificat après 3 tentatives."
          exit 1

      # Vérification sur l'ORIGINE, pas sur le nom public : sinon on comparerait
      # à nouveau le cert edge de Cloudflare au cert GitHub. Le nouveau cert met
      # quelques minutes à arriver sur les 4 IP de GitHub Pages : on attend
      # jusqu'à 20 min qu'elles le servent toutes, pour les deux noms.
      - name: Verify origin certificate
        if: steps.check.outputs.skip == 'false'
        run: |
          for i in $(seq 1 40); do
            OK=1
            for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
              for name in "$DOMAIN" "$APEX"; do
                END=$(echo | timeout 10 openssl s_client -connect "$ip:443" -servername "$name" 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
                DAYS=$(( ( $(date -d "${END:-now}" +%s) - $(date +%s) ) / 86400 ))
                [ "$DAYS" -gt 30 ] || { OK=0; echo "  $ip $name : $DAYS jours (${END:-illisible})"; }
              done
            done
            if [ "$OK" = 1 ]; then echo "Nouveau cert servi par les 4 IP pour les 2 noms."; exit 0; fi
            echo "[$i/40] pas encore partout, nouvel essai dans 30 s."
            sleep 30
          done
          echo "ERREUR : le nouveau cert n'est pas servi partout après 20 min."
          exit 1

      # Best-effort : le GH_PAT actuel est un fine-grained token sans la
      # permission "Pages: write" (403 sur PUT /pages). Le renouvellement ne
      # dépend pas de ce réglage, qui se coche à la main dans Settings > Pages —
      # on ne fait donc pas échouer le job pour ça.
      - name: Enforce HTTPS (best-effort)
        if: steps.check.outputs.skip == 'false'
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          CODE=$(curl -s -o /tmp/enforce.out -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"https_enforced":true}')
          if [ "$CODE" -lt 300 ]; then
            echo "https_enforced activé."
          else
            echo "::warning::https_enforced non modifié (HTTP $CODE) — à cocher manuellement dans Settings > Pages."
            cat /tmp/enforce.out
          fi

      # Étape isolée en if: always() — dans l'ancienne version la condition était
      # combinée au flag skip, ce qui la sautait quand la sonde elle-même plantait
      # et laissait le proxy coupé.
      - name: Re-enable Cloudflare proxy
        if: always() && steps.proxy_off.outputs.touched == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          RECORDS=$(curl -sf \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read -r id; do
            echo "Re-enabling proxy: $id"
            curl -sf -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":true}' | jq -r '.result.name + " -> proxied=" + (.result.proxied|tostring)'
          done

      - name: Notify Discord on failure
        if: failure() && !inputs.test_notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          [ -n "${WEBHOOK:-}" ] || { echo "::warning::secret DISCORD_WEBHOOK_URL vide : aucune alerte envoyée"; exit 0; }
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$(jq -n \
            --arg url "https://github.com/$REPO/actions/runs/${{ github.run_id }}" \
            '{content: ("⚠️ Renouvellement du certificat SSL du site en échec — intervention requise.\n" + $url)}')"
