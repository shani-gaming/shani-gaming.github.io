name: Renew GitHub Pages SSL Certificate

on:
  schedule:
    - cron: '0 3 1 * *'  # 1er de chaque mois
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer le renouvellement même si le cert est valide'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  renew-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Check cert expiry
        id: check
        run: |
          EXPIRY=$(echo | openssl s_client -connect www.sagesdepandarie.ovh:443 \
            -servername www.sagesdepandarie.ovh 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2)
          echo "Expiry: $EXPIRY"
          EXPIRY_TS=$(date -d "$EXPIRY" +%s)
          echo "expiry_ts=$EXPIRY_TS" >> $GITHUB_OUTPUT
          DAYS=$(( ( $EXPIRY_TS - $(date +%s) ) / 86400 ))
          echo "Days remaining: $DAYS"
          if [ "$DAYS" -gt 35 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Cert valid for $DAYS days — nothing to do."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Cert expires in $DAYS days — renewing (force=${{ inputs.force }})."
          fi

      - name: Disable Cloudflare proxy
        if: steps.check.outputs.skip == 'false'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RECORDS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?proxied=true&per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read id; do
            echo "Disabling proxy: $id"
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":false}'
          done

      - name: Trigger GitHub Pages cert renewal
        if: steps.check.outputs.skip == 'false'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Lecture du fichier CNAME..."
          CNAME_INFO=$(curl -s \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/shani-gaming/shani-gaming.github.io/contents/CNAME")
          SHA=$(echo "$CNAME_INFO" | jq -r '.sha')
          echo "SHA: $SHA"

          echo "Mise à jour du CNAME pour forcer un rebuild Pages..."
          RESULT=$(curl -s -X PUT \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/shani-gaming/shani-gaming.github.io/contents/CNAME" \
            -d "{
              \"message\": \"chore: trigger SSL cert renewal\",
              \"content\": \"$(printf 'www.sagesdepandarie.ovh' | base64 -w0)\",
              \"sha\": \"$SHA\"
            }")
          echo "$RESULT" | jq '.commit.sha // .message'

          echo "Attente 15 min pour que GitHub émette le cert..."
          sleep 900

      - name: Verify cert was renewed
        if: steps.check.outputs.skip == 'false'
        run: |
          OLD_TS=${{ steps.check.outputs.expiry_ts }}
          NEW_EXPIRY=$(echo | openssl s_client -connect www.sagesdepandarie.ovh:443 \
            -servername www.sagesdepandarie.ovh 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2)
          NEW_TS=$(date -d "$NEW_EXPIRY" +%s)
          echo "Ancien cert : $(date -d @$OLD_TS)"
          echo "Nouveau cert : $NEW_EXPIRY"
          if [ "$NEW_TS" -gt "$OLD_TS" ]; then
            echo "Cert renouvelé avec succès !"
          else
            echo "ERREUR : le cert n'a pas été renouvelé. Intervention manuelle requise."
            exit 1
          fi

      - name: Re-enable Cloudflare proxy
        if: steps.check.outputs.skip == 'false' && always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RECORDS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read id; do
            echo "Re-enabling proxy: $id"
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":true}'
          done
