name: Renew GitHub Pages SSL Certificate

on:
  schedule:
    - cron: '0 3 1 * *'  # 1er de chaque mois
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Check cert expiry
        id: check
        run: |
          EXPIRY=$(echo | openssl s_client -connect www.sagesdepandarie.ovh:443 \
            -servername www.sagesdepandarie.ovh 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2)
          echo "Expiry: $EXPIRY"
          EXPIRY_TS=$(date -d "$EXPIRY" +%s)
          echo "expiry_ts=$EXPIRY_TS" >> $GITHUB_OUTPUT
          DAYS=$(( ( $EXPIRY_TS - $(date +%s) ) / 86400 ))
          echo "Days remaining: $DAYS"
          if [ "$DAYS" -gt 35 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Cert valid for $DAYS days — nothing to do."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Cert expires in $DAYS days — renewing."
          fi

      - name: Disable Cloudflare proxy
        if: steps.check.outputs.skip == 'false'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RECORDS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?proxied=true&per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read id; do
            echo "Disabling proxy: $id"
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":false}'
          done

      - name: Wait for GitHub to renew cert (15 min)
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "Proxy désactivé — attente 15 min pour que GitHub renouvelle le cert..."
          sleep 900

      - name: Verify cert was renewed
        if: steps.check.outputs.skip == 'false'
        run: |
          OLD_TS=${{ steps.check.outputs.expiry_ts }}
          NEW_EXPIRY=$(echo | openssl s_client -connect www.sagesdepandarie.ovh:443 \
            -servername www.sagesdepandarie.ovh 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2)
          NEW_TS=$(date -d "$NEW_EXPIRY" +%s)
          echo "Ancien cert : $(date -d @$OLD_TS)"
          echo "Nouveau cert : $NEW_EXPIRY"
          if [ "$NEW_TS" -gt "$OLD_TS" ]; then
            echo "Cert renouvelé avec succès !"
          else
            echo "AVERTISSEMENT : le cert n'a pas été renouvelé. Vérifier manuellement."
          fi

      - name: Re-enable Cloudflare proxy
        if: steps.check.outputs.skip == 'false'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          RECORDS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records?per_page=100" \
            -H "Authorization: Bearer $CF_TOKEN")

          echo "$RECORDS" | jq -r '.result[] | select(.content | test("github\\.io|185\\.199\\.")) | .id' \
          | while read id; do
            echo "Re-enabling proxy: $id"
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records/$id" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"proxied":true}'
          done
